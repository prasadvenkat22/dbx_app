resources:
  apps:
    wanderbricks_app:
      name: wanderbricks-api
      description: "REST API for samples.wanderbricks Unity Catalog data"
      source_code_path: ../../src

      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

      config:
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: LAKEBASE_HOST
            value: ${var.lakebase_host}
          - name: LAKEBASE_ENDPOINT
            value: ${var.lakebase_endpoint}
