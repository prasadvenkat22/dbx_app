# The main pipeline for dbx_app

resources:
  pipelines:
    dbx_app_etl:
      name: dbx_app_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../../src/dbx_app_etl"

      libraries:
        - glob:
            include: ../../src/dbx_app_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
