# This is a Databricks asset bundle definition for dbx_app.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbx_app
  uuid: 21e445d9-4508-4144-a99b-9d0e5cb8fbef

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse ID used by the Wanderbricks FastAPI app

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-96663a11-56a8.cloud.databricks.com
      profile: venkat
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
      warehouse_id: "9a9e6998ebd419bf"
  prod:
    mode: production
    workspace:
      host: https://dbc-96663a11-56a8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/venkatangirala@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/venkatangirala@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbx_app
      schema: prod
    permissions:
      - user_name: venkatangirala@gmail.com
        level: CAN_MANAGE
