# Databricks Asset Bundle for dbx_app (Wanderbricks FastAPI)
# See https://docs.databricks.com/dev-tools/bundles/index.html
#
# SETUP FOR A NEW WORKSPACE
# --------------------------
# 1. Run: databricks configure          (authenticates CLI, saves host + token)
# 2. Edit the variables below:
#      warehouse_id  → your SQL Warehouse ID (Compute → SQL Warehouses → copy ID)
#      lakebase_host → your Lakebase endpoint host (optional, for bookings)
#      lakebase_endpoint → your Lakebase endpoint path (optional, for bookings)
# 3. Run: databricks bundle deploy -t dev
# 4. Run: databricks bundle run -t dev wanderbricks_app

bundle:
  name: dbx_app
  uuid: 21e445d9-4508-4144-a99b-9d0e5cb8fbef

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog name (must exist in your workspace)
  schema:
    description: Schema within the catalog
  warehouse_id:
    description: >
      SQL Warehouse ID — found in Databricks UI under
      Compute → SQL Warehouses → your warehouse → Connection details
  lakebase_host:
    description: >
      Lakebase Postgres endpoint host — found in Databricks UI under
      Compute → Database instances → your instance → Connection details.
      Leave blank if not using the bookings feature.
    default: ""
  lakebase_endpoint:
    description: >
      Lakebase endpoint resource path, e.g.
      projects/<project-id>/branches/production/endpoints/primary
      Leave blank if not using the bookings feature.
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Set this to your workspace URL, e.g. https://my-workspace.azuredatabricks.net
      # Or remove this line and just run: databricks configure
      host: https://dbc-96663a11-56a8.cloud.databricks.com
      profile: venkat
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
      warehouse_id: "9a9e6998ebd419bf"
      lakebase_host: "ep-long-wildflower-d8ew0atm.database.us-east-2.cloud.databricks.com"
      lakebase_endpoint: "projects/dbx-lbase/branches/production/endpoints/primary"

  prod:
    mode: production
    workspace:
      host: https://dbc-96663a11-56a8.cloud.databricks.com
    variables:
      catalog: workspace
      schema: prod
      warehouse_id: ""   # Set your prod warehouse ID here
      lakebase_host: ""
      lakebase_endpoint: ""
    permissions:
      - level: CAN_MANAGE
        group_name: admins
